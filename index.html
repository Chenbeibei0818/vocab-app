<title>背单词</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#4361ee;--pri-lt:#eef1ff;--ok:#06d6a0;--ok-bg:#eafff8;--err:#ef476f;--err-bg:#ffeef2;--warn-bg:#fff9e6;--bg:#f0f2f5;--bg2:#fff;--tx:#1a1a2e;--tx2:#555;--mt:#999;--bd:#e8e8ef;--r:12px;--rp:100px;--sh:0 2px 8px rgba(0,0,0,.07)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx);max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

.bar{background:var(--bg2);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
.bar h1{font-size:16px;font-weight:700}

.cats{display:flex;gap:8px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto}
.cat{flex-shrink:0;padding:7px 14px;border-radius:var(--rp);border:1.5px solid #ccc;background:var(--bg2);font-size:13px;font-weight:600;cursor:pointer;color:var(--tx2)}
.cat:hover{border-color:var(--pri);color:var(--pri)}
.cat.on{background:var(--pri);color:#fff;border-color:var(--pri)}

.main{flex:1;padding:16px;padding-bottom:80px}
.pg{display:none}.pg.on{display:block}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.st{background:var(--bg2);border-radius:var(--r);padding:16px 12px;text-align:center;box-shadow:var(--sh)}
.st b{display:block;font-size:28px;font-family:'SF Mono',Consolas,monospace}
.st small{font-size:11px;color:var(--mt)}
.st.c1 b{color:var(--pri)}.st.c2 b{color:var(--ok)}.st.c3 b{color:var(--err)}

/* Mode cards */
.mc{background:var(--bg2);border-radius:var(--r);padding:18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--sh);border:1px solid transparent;transition:all .15s}
.mc:hover{border-color:var(--pri);transform:translateY(-1px)}
.mi{width:44px;height:44px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.mi.a{background:var(--pri-lt)}.mi.b{background:var(--ok-bg)}.mi.c{background:var(--warn-bg)}
.mt{font-weight:700;font-size:15px;margin-bottom:2px}
.md{font-size:12px;color:var(--mt)}

/* Word card */
.ww{perspective:1000px;margin-bottom:14px;cursor:pointer}
.wc{background:var(--bg2);border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.1);transition:transform .5s;transform-style:preserve-3d;position:relative;min-height:320px}
.wc.flip{transform:rotateY(180deg)}
.wf,.wb{padding:24px;backface-visibility:hidden;position:absolute;width:100%;top:0;left:0}
.wb{transform:rotateY(180deg)}
.wen{font-size:26px;font-weight:800;margin-bottom:4px}
.wph{font-size:14px;color:var(--mt);font-family:monospace;margin-bottom:14px}
.wcn{font-size:17px;font-weight:600;color:var(--pri);padding:8px 12px;background:var(--pri-lt);border-radius:8px;display:inline-block;margin-bottom:14px}
.wsl{font-size:11px;color:var(--mt);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:4px}
.wex{font-size:13px;color:var(--tx2);font-style:italic;line-height:1.5}
.wexc{font-size:12px;color:var(--mt);margin-top:2px}
.wtip{font-size:13px;padding:8px 12px;background:var(--warn-bg);border-radius:8px;color:#8a6d3b;margin-top:10px}
.hint{text-align:center;color:var(--mt);font-size:12px;margin-top:6px}

/* Progress */
.pbt{font-size:12px;color:var(--mt);display:flex;justify-content:space-between;margin-bottom:6px}
.pbw{background:var(--bd);border-radius:var(--rp);height:5px;margin-bottom:14px;overflow:hidden}
.pbf{height:100%;background:linear-gradient(90deg,var(--pri),#7c3aed);border-radius:var(--rp);transition:width .3s}

/* Buttons */
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1;padding:11px;border-radius:var(--r);border:none;font-size:14px;font-weight:600;cursor:pointer}
.bp{background:var(--bg);color:var(--tx2)}.bp:hover{background:var(--bd)}
.bn{background:var(--pri);color:#fff}.bn:hover{opacity:.9}
.bk{background:var(--ok);color:#fff}.bd{background:var(--err);color:#fff}

/* Test */
.tq{background:var(--bg2);border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.1);margin-bottom:14px}
.tw{font-size:24px;font-weight:800;text-align:center;margin-bottom:2px}
.tp{text-align:center;font-size:14px;color:var(--mt);font-family:monospace;margin-bottom:18px}
.to{padding:13px 14px;border:1.5px solid var(--bd);border-radius:var(--r);cursor:pointer;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;background:var(--bg2);transition:all .15s}
.to:hover{border-color:var(--pri);background:var(--pri-lt)}
.ol{width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;color:var(--tx2)}
.to.ok{border-color:var(--ok);background:var(--ok-bg)}.to.ok .ol{background:var(--ok);color:#fff}
.to.no{border-color:var(--err);background:var(--err-bg)}.to.no .ol{background:var(--err);color:#fff}

var V;

// Safe localStorage
function LS(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

var pg=0, cat='all', si=0, ti=0, ts=0, tw=0, ta=false, tq=[];
var nb=[];
try{nb=JSON.parse(LS('nb2')||'[]');}catch(e){nb=[];}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function all(){var r=[];for(var k in V){var c=V[k];for(var i=0;i<c.words.length;i++){var w={};for(var p in c.words[i])w[p]=c.words[i][p];w.cat=k;r.push(w);}}return r;}
function filt(){return cat==='all'?all():V[cat].words.map(function(w){var o={};for(var p in w)o[p]=w[p];o.cat=cat;return o;});}
function saveNb(){LS('nb2',JSON.stringify(nb));ubdg();}
function addNb(w){if(!inNb(w.en)){nb.push(w);saveNb();}}
function rmNb(en){nb=nb.filter(function(w){return w.en!==en;});saveNb();}
function inNb(en){return nb.some(function(w){return w.en===en;});}
function ubdg(){var b=document.getElementById('BDG');if(nb.length>0){b.style.display='flex';b.textContent=nb.length;}else{b.style.display='none';}}
function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

// Categories
function rCat(){
  var el=document.getElementById('C');
  var t=all().length;
  var s='<button class="cat on" data-c="all">全部 '+t+'</button>';
  for(var k in V){s+='<button class="cat" data-c="'+k+'">'+V[k].icon+' '+V[k].name+' '+V[k].words.length+'</button>';}
  el.innerHTML=s;
}
document.getElementById('C').addEventListener('click',function(e){
  var b=e.target.closest('.cat');if(!b)return;
  cat=b.dataset.c;si=0;
  document.querySelectorAll('.cat').forEach(function(x){x.classList.toggle('on',x.dataset.c===cat);});
  show();
});

// Nav
document.getElementById('BN').addEventListener('click',function(e){
  var b=e.target.closest('.nb');if(!b)return;
  go(parseInt(b.dataset.p));
});

function go(p){
  pg=p;
  document.querySelectorAll('.pg').forEach(function(x,i){x.classList.toggle('on',i===p);});
  document.querySelectorAll('.nb').forEach(function(x){x.classList.toggle('on',parseInt(x.dataset.p)===p);});
  show();
}
function show(){
  if(pg===0)rHome();
  if(pg===1)rStudy();
  if(pg===2)rTest();
  if(pg===3)rNb();
}

document.getElementById('P1').addEventListener('click',function(e){
  var ww=e.target.closest('#WW');
  if(ww){var wc=document.getElementById('WC');if(wc)wc.classList.toggle('flip');return;}

  var a=btn.dataset.a,ws=filt();

function rTest(){

  var el=document.getElementById('P2');

    '<div class="tq"><div class="tw">'+esc(w.en)+'</div><div class="tp">'+esc(w.ph)+'</div><div id="TO">';
  for(var i=0;i<opts.length;i++){s+='<div class="to" data-i="'+i+'" data-ci="'+ci+'"><span class="ol">'+lt[i]+'</span><span>'+esc(opts[i])+'</span></div>';}
  s+='</div><div class="fb" id="FB"></div></div>';
  s+='<div class="nav" id="TN" style="display:none"><button class="bn" data-a="tn" style="flex:1">下一题 ▶</button></div>';
  el.innerHTML=s;
}
document.getElementById('P2').addEventListener('click',function(e){
  var opt=e.target.closest('.to');
  if(opt&&!ta){
    ta=true;
    var pi=parseInt(opt.dataset.i),ci=parseInt(opt.dataset.ci),ok=pi===ci;
    var w=tq[ti];
    document.querySelectorAll('.to').forEach(function(o,i){
      if(i===ci)o.classList.add('ok');
      else if(o===opt&&!ok)o.classList.add('no');
      if(o!==opt&&i!==ci)o.classList.add('off');
    });
    var fb=document.getElementById('FB');
    if(ok){ts++;LS('vc2',(parseInt(LS('vc2')||'0')+1).toString());fb.className='fb on fok';fb.innerHTML='✅ 正确！<br><b>记忆提示：</b>'+esc(w.tip);}
    else{tw++;addNb(w);fb.className='fb on fno';fb.innerHTML='❌ 错误！正确答案：<b>'+esc(w.cn)+'</b><br><b>记忆提示：</b>'+esc(w.tip)+'<br><small style="opacity:.7">已自动加入生词本</small>';}
    document.getElementById('TN').style.display='flex';
    return;
  }
  var btn=e.target.closest('[data-a="tn"]');
  if(btn){ti++;rTQ();}
  var rs=e.target.closest('[data-a="rs"]');
  if(rs){rTest();}
});

function rTR(){
  var el=document.getElementById('P2');
  var p=tq.length?Math.round(ts/tq.length*100):0;
  var ic=p>=80?'🎉':p>=60?'👍':'💪',cl=p>=80?'var(--ok)':p>=60?'#ffd166':'var(--err)';
  el.innerHTML='<div class="res"><div class="ri">'+ic+'</div><div class="rs" style="color:'+cl+'">'+p+'%</div><div class="rl">正确率</div>'+
    '<div class="rss"><div class="rok"><div class="rsn">'+ts+'</div><div class="rsl">答对</div></div><div class="rno"><div class="rsn">'+tw+'</div><div class="rsl">答错</div></div><div><div class="rsn">'+tq.length+'</div><div class="rsl">总题数</div></div></div>'+
    '<button class="brs" data-a="rs">🔄 再来一轮</button></div>';
}

// Notebook
function rNb(){
  var el=document.getElementById('P3');
  if(!nb.length){el.innerHTML='<div class="ne"><b>📌</b><p>生词本还是空的~<br>在背词或测试中加入生词</p></div>';return;}
  var s='<div class="nh"><h3>📌 生词本</h3><span class="nc">'+nb.length+' 词</span></div>';
  for(var i=0;i<nb.length;i++){
    var w=nb[i],ci=V[w.cat]||{icon:''};
    s+='<div class="ni" data-ni="'+i+'"><span class="nw">'+esc(w.en)+'</span><span class="nn">'+esc(w.cn)+'</span><span>'+ci.icon+'</span><button class="nr" data-rm="'+i+'">🗑</button></div>';
  }
  el.innerHTML=s;
}
document.getElementById('P3').addEventListener('click',function(e){
  var rm=e.target.closest('[data-rm]');
  if(rm){e.stopPropagation();var i=parseInt(rm.dataset.rm);nb.splice(i,1);saveNb();rNb();return;}
  var ni=e.target.closest('.ni');
  if(ni){var w=nb[parseInt(ni.dataset.ni)],aws=all(),idx=-1;
    for(var j=0;j<aws.length;j++){if(aws[j].en===w.en){idx=j;break;}}
    if(idx>=0){cat='all';document.querySelectorAll('.cat').forEach(function(b){b.classList.toggle('on',b.dataset.c==='all');});si=idx;go(1);}
  }
});

rCat();rHome();ubdg();
